# Application
spring.application.name=cloverpit-backend

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# DevTools
spring.devtools.restart.enabled=false

# MongoDB (환경변수로 분리)
spring.data.mongodb.uri=${MONGODB_URI}

# Security (기본 계정 제거 권장)
spring.security.user.name=${SPRING_SECURITY_USER}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# PUBG API
pubg.api-key=${PUBG_API_KEY}
pubg.platform=steam
pubg.shard=steam
pubg.base-url=https://api.pubg.com/shards

# Discord
discord.webhook.url=${DISCORD_WEBHOOK_URL}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.com.cloverpit=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
